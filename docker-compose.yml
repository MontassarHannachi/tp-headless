services:
  strapi:
    build: ./backend-accessoires
    image: backend-accessoires
    container_name: strapi
    env_file: ./backend-accessoires/.env
    environment:
      HOST: 0.0.0.0
      PORT: "1337"
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      STORE_API_SECRET: ${STORE_API_SECRET}
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - ./backend-accessoires/.tmp:/app/.tmp
      - ./backend-accessoires/public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-vitrine
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:1337}
    image: frontend-vitrine
    container_name: frontend
    environment:
      API_INTERNAL_URL: http://strapi:1337
      STORE_API_SECRET: ${STORE_API_SECRET}
    depends_on:
      strapi:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "192.168.213.129:80:80"
      - "192.168.213.129:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    restart: unless-stopped
